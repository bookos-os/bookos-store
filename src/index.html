<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="bookos-palette.js"></script>
<title>Bookos Store</title>
<script src="locales.js"></script>
<script src="i18n.js"></script>
</head>
<body data-i18n-title="app.title">
<div class="main-container windowed" id="mc">
  <div class="titlebar" data-tauri-drag-region>
    <!-- Glifos y medidas de bookos-shell/src/decoracion.rs (HIG 11.2). -->
    <div class="controls">
      <button id="minimize" data-i18n-title="wm.minimize" title="Minimizar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8H12.5"/></svg></button>
      <button id="maximize" data-i18n-title="wm.maximize" title="Maximizar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5H12.5V12.5H3.5Z"/></svg></button>
      <button id="close" data-i18n-title="wm.close" title="Cerrar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 4.6L11.4 11.4M11.4 4.6L4.6 11.4"/></svg></button>
    </div>
  </div>

  <div class="split-view">
    <nav class="sidebar">
      <div class="sidebar-header" data-tauri-drag-region><h1 class="header-title" data-i18n="app.name" data-tauri-drag-region>Tienda</h1></div>
      <div class="search-container">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
        <input type="text" class="search-bar" id="search" data-i18n-ph="search.ph" placeholder="Buscar apps…" spellcheck="false" autocomplete="off">
        <button class="search-clear hidden" id="search-x" data-i18n-title="search.clear" title="Borrar búsqueda"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6l12 12"/></svg></button>
      </div>
      <div id="sb"></div>
    </nav>
    <main class="detail-view"><div id="page"></div></main>
  </div>
</div>

<div class="overlay auth hidden" id="auth-overlay">
  <div class="bk-dialog">
    <div class="bk-dialog-title" id="auth-title" data-i18n="auth.title">Permisos requeridos</div>
    <div class="bk-dialog-msg" id="auth-desc" data-i18n="auth.desc">Introduce la contraseña del equipo.</div>
    <div class="auth-input-wrap">
      <input type="password" id="auth-input" data-i18n-ph="auth.ph" placeholder="Contraseña" spellcheck="false" autocomplete="off">
      <button type="button" class="auth-eye" id="auth-eye" data-i18n-title="auth.eye" title="Mostrar/Ocultar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
      </button>
    </div>
    <div class="auth-err hidden" id="auth-err" data-i18n="auth.err">Contraseña incorrecta</div>
    <div class="bk-dialog-btns">
      <button class="bk-btn" id="auth-cancel" data-i18n="cancel">Cancelar</button>
      <button class="bk-btn primary" id="auth-ok" data-i18n="auth.ok">Autorizar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="main.js" type="module"></script>
</body>
</html>
